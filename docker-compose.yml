version: "3.8"

services:
  load-balancer:
    image: nginx:latest
    container_name: nginx-balanceador
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-backend
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  api-backend:
    build: .
    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://0.0.0.0:5000/health")'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

    deploy:
      replicas: 4
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.15"
          memory: 256M

  log-viewer:
    image: amir20/dozzle:latest
    container_name: dozzle-logs
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
