version: "3.8"

services:
  load-balancer:
    image: nginx:latest
    container_name: nginx-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api_backend
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M

  api_backend:
    build: .
    # container_name: api-limitada
    expose:
      - "5000"
    # ports:
    #   - "5000:5000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  logs-viewer:
    image: amir20/dozzle:latest
    container_name: dozzle-logs
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
